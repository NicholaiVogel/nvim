# Terminal settings
set -g default-terminal "tmux-256color"
set-option -g status-position top

# Keybinds
unbind r
bind r source-file ~/.tmux.conf \; display "reloaded-config"
unbind C-b
set -g prefix C-w

# Preferences
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g repeat-time 1000
set -g history-limit 10000

# Clipboard (wayland)
set -g set-clipboard on
set -g extended-keys on
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -n MouseDown2Pane run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"

# Pane separators
set -g pane-border-lines simple

# Vim keybinds for navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#Vim keybinds for resizing
bind-key -r Left  resize-pane -L 3 
bind-key -r Down  resize-pane -D 3 
bind-key -r Up    resize-pane -U 3 
bind-key -r Right resize-pane -R 3 

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_flags "icon"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g status-right-length 100

# TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
